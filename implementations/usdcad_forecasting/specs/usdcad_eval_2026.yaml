# Protected eval — held-out 2026 window, scored through multi_evaluate() with a budget.
#
# This is the honest scoreboard. 2026 is after the Gemini training cutoff, so
# neither the numerical methods nor the LLM-Process should have seen the
# outcomes. Treat it as scarce: `max_runs` caps how many times the spec may be
# scored (via EvalTracker), so iterate on `usdcad_backtest_2025.yaml` and spend
# this only on a curated set of finalists (chosen in the notebook's eval cell).
#
# Loaded as a MultiTargetEvalSpec: one single-horizon task per target, all under
# a single shared run budget. One multi_evaluate() call across all three
# horizons counts as ONE run against `max_runs` — the budget is keyed by
# `spec_id`, not per-horizon. The predictor roster lives in the notebook.
#
# Primary target:
#   FRED DEXCAUS — USD/CAD exchange rate (Canadian dollars per U.S. dollar).
#
# Target variables:
#   usdcad_logret_1b  — 1-business-day forward log return
#   usdcad_logret_5b  — 5-business-day forward log return
#   usdcad_logret_21b — 21-business-day forward log return

spec_id: usdcad_eval_2026

description: >-
  Protected eval: weekly origins across early/mid 2026 (post-cutoff),
  forecasting USD/CAD forward cumulative log returns at 1/5/21 business days.

tasks:
  - task_id: usdcad_logret_1b
    target_series_id: usdcad_logret_1b
    horizons: [1]
    frequency: B
    description: >-
      USD/CAD forward cumulative log return, 1 business day ahead
      (next-session return / direction).

  - task_id: usdcad_logret_5b
    target_series_id: usdcad_logret_5b
    horizons: [5]
    frequency: B
    description: >-
      USD/CAD forward cumulative log return, 5 business days ahead
      (forward 1-week return).

  - task_id: usdcad_logret_21b
    target_series_id: usdcad_logret_21b
    horizons: [21]
    frequency: B
    description: >-
      USD/CAD forward cumulative log return, 21 business days ahead
      (forward 1-month return).

start: "2026-02-02"
end: "2026-03-23"     # 8 weekly origins; all resolve at h=21
stride: 5             # weekly origins
warmup: 250

# Budget cap: each multi_evaluate() call (all 3 horizons) counts as one run.
max_runs: 5