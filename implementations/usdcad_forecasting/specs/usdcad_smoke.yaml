# Smoke spec — fast laptop run over a short, post-cutoff (2025) window.
#
# Weekly origins in late 2025: after the Gemini training cutoff (~Jan 2025), so
# the LLM-Process rows in the notebook can be compared fairly against the
# conventional methods here. The notebook keeps its LLMP predictors ON for this
# window (the predictors cell gates them on a post-cutoff flag).
#
# This spec carries experiment design only — the window, stride/warmup, and one
# single-horizon task per target. WHICH predictors run (and all their
# hyperparameters, including the covariate panel) is configured in the notebook,
# not here.
#
# Each task targets `usdcad_logret_{N}b`, representing the forward cumulative
# log return over N business days.
#
# Prerequisites:
#   uv run python scripts/fetch_fred.py
#
# The primary target is FRED DEXCAUS:
#   USD/CAD exchange rate (Canadian dollars per U.S. dollar).

spec_id: usdcad_smoke

description: >-
  Smoke multivariate demo: weekly origins in late 2025 (post-cutoff),
  forecasting USD/CAD forward cumulative log returns at 1/5/21 business days.

tasks:
  - task_id: usdcad_logret_1b
    target_series_id: usdcad_logret_1b
    horizons: [1]
    frequency: B
    description: >-
      USD/CAD forward cumulative log return, 1 business day ahead
      (next-session return / direction).

  - task_id: usdcad_logret_5b
    target_series_id: usdcad_logret_5b
    horizons: [5]
    frequency: B
    description: >-
      USD/CAD forward cumulative log return, 5 business days ahead
      (forward 1-week return).

  - task_id: usdcad_logret_21b
    target_series_id: usdcad_logret_21b
    horizons: [21]
    frequency: B
    description: >-
      USD/CAD forward cumulative log return, 21 business days ahead
      (forward 1-month return).

start: "2025-10-06"
end: "2025-11-14"
stride: 5            # weekly origins (~6)
warmup: 250