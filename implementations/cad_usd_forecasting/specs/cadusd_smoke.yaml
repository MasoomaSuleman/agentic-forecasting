# Fast baseline comparison over a short historical window.
# The notebook controls which predictors run; this file defines tasks and origins.

spec_id: cadusd_smoke

description: >-
  Smoke comparison of AutoARIMA, linear regression, and LightGBM for CAD/USD
  cumulative log returns at 1, 5, and 21 business-day horizons.

tasks:
  - task_id: cadusd_logret_1b
    target_series_id: cadusd_logret_1b
    horizons: [1]
    frequency: B
    description: CAD/USD cumulative log return one business day ahead.

  - task_id: cadusd_logret_5b
    target_series_id: cadusd_logret_5b
    horizons: [5]
    frequency: B
    description: CAD/USD cumulative log return five business days ahead.

  - task_id: cadusd_logret_21b
    target_series_id: cadusd_logret_21b
    horizons: [21]
    frequency: B
    description: CAD/USD cumulative log return twenty-one business days ahead.

start: "2025-10-06"
end: "2025-11-14"
stride: 5
warmup: 250
